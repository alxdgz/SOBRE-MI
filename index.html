<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre mí</title>
    <style>
        :root {
            --verde: #00ff41;
            --verde-oscuro: #008f11;
            --verde-tenue: #003b00;
            --negro: #0d0208;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #0a1f0e 0%, var(--negro) 70%);
            color: var(--verde);
            font-family: "Courier New", Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-x: hidden;
        }

        /* Tarjeta central tipo terminal */
        .terminal {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--verde-oscuro);
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.25),
                        inset 0 0 20px rgba(0, 255, 65, 0.05);
            padding: 40px 32px;
            text-align: center;
        }

        h1 {
            font-size: 2.6rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 8px var(--verde), 0 0 20px var(--verde-oscuro);
            margin-bottom: 32px;
        }

        /* Cursor parpadeante */
        h1::after {
            content: "_";
            animation: parpadeo 1s steps(1) infinite;
        }

        @keyframes parpadeo {
            50% { opacity: 0; }
        }

        h3 {
            font-weight: normal;
            font-size: 1rem;
            color: #b6ffb6;
            margin: 24px 0 12px;
        }

        h3::before {
            content: "// ";
            color: var(--verde-oscuro);
        }

        /* Enlaces como botones */
        a {
            display: inline-block;
            min-width: 200px;
            padding: 14px 28px;
            color: var(--verde);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
            font-family: inherit;
            border: 2px solid var(--verde);
            border-radius: 4px;
            background: transparent;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
            transition: all 0.25s ease;
        }

        a:hover,
        a:focus-visible {
            background: var(--verde);
            color: var(--negro);
            box-shadow: 0 0 20px var(--verde), 0 0 40px var(--verde-oscuro);
            transform: translateY(-2px);
            outline: none;
        }

        a:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.9rem; }
            .terminal { padding: 36px 20px; }
            a { width: 100%; min-width: 0; }
        }
    </style>
</head>
<body>
    <main class="terminal">
        <h1>Sobre mí</h1>

        <h3>Este es mi Linkedin!!</h3>
        <a href="https://www.linkedin.com/in/alejandro-di%C3%A9guez-garrido-668a63299/" target="_blank" rel="noopener">Linkedin</a>
    </main>
</body>
</html>
